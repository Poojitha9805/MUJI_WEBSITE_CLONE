<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUJI Login</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
    background: #fff;
    padding: 40px;
    width: 400px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.logo {
    font-size: 32px;
    font-weight: bold;
    color: #7a0019;
}

.login-text {
    margin: 10px 0 30px;
    font-size: 18px;
}

.input-group {
    text-align: left;
    margin-bottom: 20px;
}

.input-group label {
    font-size: 14px;
}

.input-group input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
}

.terms {
    font-size: 14px;
    text-align: left;
    margin-bottom: 20px;
}

.terms a {
    color: #7a0019;
    text-decoration: none;
}

button {
    width: 100%;
    padding: 12px;
    background-color: #ccc;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    /* cursor: not-allowed; */
    cursor: pointer;



}
button:hover{
    background-color: #7a0019;
}
</style>
</head>

<body>
<form action="./muji.html">
<div class="container">
    <div class="logo">MUJI</div>
    <div class="login-text">Login</div>

    <div class="input-group">
        <label>Mobile*</label>
        <input type="text" placeholder="+91 enter number">
    </div>

    <div class="terms">
        <input type="checkbox"> 
        By continuing, I agree to the 
        <a href="#">Terms of Service</a> & 
        <a href="#">Privacy Policy</a>
    </div>

    <button>GET OTP</button>
</div>
</form>
</body>
</html>
